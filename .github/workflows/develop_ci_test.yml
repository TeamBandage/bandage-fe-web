name: Develop PR CI & Test
on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: read

jobs:
  build-test:
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop') || (github.event_name == 'push' && github.ref_name == 'develop') }}
    runs-on: ubuntu-latest

    env:
      # 실제 API 키가 아니며, env.ts(zod) 런타임 검증을 통과시키기 위한 CI 전용 더미 값.
      # 운영/스테이지 배포 환경에서는 배포 플랫폼(예: Vercel)의 환경 변수로 주입되어야 함.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_APP_ENV: dev

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup pnpm
        # 버전은 package.json 의 "packageManager" 필드(해시 pin) 를 단일 소스로 사용.
        # 여기서 version 을 함께 지정하면 ERR_PNPM_BAD_PM_VERSION 으로 충돌합니다.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit tests (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

      # Playwright 단계는 브라우저 캐싱 미적용으로 매 실행마다 시간이 오래 걸려 임시로 비활성화합니다.
      # 캐싱 전략 정리 또는 E2E 테스트 도입 시점에 다시 활성화하세요.
      # - name: Install Playwright browsers
      #   run: pnpm exec playwright install --with-deps
      #
      # - name: E2E tests (Playwright)
      #   run: pnpm test:e2e
