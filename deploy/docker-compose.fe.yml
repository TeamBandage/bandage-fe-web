# ~/bandage/docker-compose.fe.yml — BE 의 docker-compose.yml 과 합쳐서 실행.
#
# 사용:
#   docker compose -f docker-compose.yml -f docker-compose.fe.yml ...
#
# image 필드는 환경변수 ${FE_IMAGE} 로 인터폴레이션 — workflow 가 SSH 안에서
# `export FE_IMAGE=<registry>/bandage-fe:dev-<sha>` 후 docker compose 호출.
# (compose 의 기본 동작: 호출 시점의 환경변수를 ${...} 형태로 치환)

services:
  fe-web:
    image: ${FE_IMAGE}
    container_name: bandage-fe
    expose:
      - '3000'
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      api-server-a:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: bandage-nginx
    ports:
      - '80:80'
      # 향후 HTTPS 도입 시: '443:443' 추가 + cert volume 마운트
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      fe-web:
        condition: service_started
      api-server-a:
        condition: service_started
    restart: always
