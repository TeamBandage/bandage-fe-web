server {
    listen 80 default_server;
    server_name _;

    # 이미지 업로드 등 큰 본문 대비
    client_max_body_size 10m;

    # 정적 upstream { server ...; } 블록을 두지 않는다 — startup 시 DNS resolve 실패로
    # nginx 가 emerg 종료되는 케이스를 피하기 위해 변수 형태 proxy_pass 만 사용
    # (실제 해석은 nginx.conf 의 `resolver 127.0.0.11` 이 매 요청 시점에 수행).

    # Next.js 정적 자원 — hash 기반이라 immutable, 1년 캐시
    location /_next/static/ {
        set $fe_upstream "http://fe-web:3000";
        proxy_pass $fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 헬스체크 — Next.js /api/health
    location /api/health {
        set $fe_upstream "http://fe-web:3000";
        proxy_pass $fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # BE API 프록시 — /api/v1/* 만 BE 로
    location /api/v1/ {
        set $be_upstream "http://bandage-band-manager:8080";
        proxy_pass $be_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # FE 모든 라우트 (SSR + middleware) + WebSocket (HMR/실시간)
    location / {
        set $fe_upstream "http://fe-web:3000";
        proxy_pass $fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
