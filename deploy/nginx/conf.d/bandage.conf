upstream fe_upstream {
    server fe-web:3000;
    keepalive 32;
}

upstream be_upstream {
    server bandage-band-manager:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    # 이미지 업로드 등 큰 본문 대비
    client_max_body_size 10m;

    # Next.js 정적 자원 — hash 기반이라 immutable, 1년 캐시
    location /_next/static/ {
        proxy_pass http://fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 헬스체크 — Next.js /api/health
    location /api/health {
        proxy_pass http://fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # BE API 프록시 — /api/v1/* 만 BE 로
    location /api/v1/ {
        proxy_pass http://be_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # FE 모든 라우트 (SSR + middleware) + WebSocket (HMR/실시간)
    location / {
        proxy_pass http://fe_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
